name: Workflow 01

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SERVER: Production

defaults:
  run:
    shell: bash

jobs:
  test-variables:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        AMBIENTE: [prd, des, des-vars, prd-vars]
    environment:
      name: ${{ matrix.AMBIENTE }}
    steps:
      - name: Print Environment Variable
        run: |
          echo $GITHUB_REPOSITORY
          gh api https://api.github.com/repos/${{ github.repository }}/environments
            -H "Accept: application/vnd.github+json" | jq '.environments[].name'