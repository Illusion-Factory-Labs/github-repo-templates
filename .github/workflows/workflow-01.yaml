name: Workflow 01

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SERVER: Production

defaults:
  run:
    shell: bash

jobs:
  test-variables:
    runs-on: ubuntu-latest
    steps:
      - name: Print Environment Variable
        run: |
          echo "The server is set to $SERVER"
          env

      - name: Use Action to Import Variables
        uses: Illusion-Factory-Labs/github-repo-templates/.github/actions/action-01@main