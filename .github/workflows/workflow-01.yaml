name: Workflow 01

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  SERVER: Production

defaults:
  run:
    shell: bash

jobs:
  test-variables:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        AMBIENTE: [prd, des, des-vars, prd-vars, criei-agora]
    environment:
      name: ${{ matrix.AMBIENTE }}
    steps:
      - name: Print Environment Variable
        id: print-env
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo $GITHUB_REPOSITORY
          gh api "https://api.github.com/repos/${{ github.repository }}/environments" \
            -H "Accept: application/vnd.github+json" | jq '.environments[].name'
      
      - name: Create variables
        needs: print-env
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh variable set API_URL \
            --env ${{ matrix.AMBIENTE }} \
            --body "https://api.${{ matrix.AMBIENTE }}.example.com"
          gh variable list --env ${{ matrix.AMBIENTE }} | grep API_URL