name: Copy GitHub Environment Variables
description: "Copy variables from one GitHub environment to another using GitHub CLI"

inputs:
  SOURCE_ENVIRONMENT:
    description: "The name of the source GitHub environment to copy variables from."
    required: true
  DESTINATION_ENVIRONMENT:
    description: "The name of the destination GitHub environment to copy variables to."
    required: true
  VARIABLES:
    description: "A comma-separated list of specific existing variable names to copy. If not provided, all variables will be copied."
    required: false
    default: "[]"

runs:
  using: "composite"
  steps:

  - name: Check input list
    shell: bash
    run: |
      set -euo pipefail

      VARS='${{ inputs.VARIABLES }}'

      # Check if empty array
      if [[ "$VARS" == "[]" || -z "$VARS" ]]; then
        echo "::notice::No variables provided"
        exit 0
      fi

      echo "Variables provided:"
      echo "$VARS" | jq -r '.[]' | while read -r var; do
        echo " - $var"
      done

