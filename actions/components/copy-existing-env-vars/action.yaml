name: Sync GitHub repository environment variables
description: >-
  "Copy variables for the same repository from an existing environment to another, creating or updating destination values when needed. 
  This action is useful for keeping environment variables DRY across multiple environments (e.g. dev, staging, prod) or for copying variables 
  to a new environment without needing to re-enter them manually. By default, all variables from the source environment will be synced to destination 
  (including deletion of destination-only variables), but you can also specify a subset of variable names to sync if desired."

inputs:
  dry_run:
    description: "Dry-run mode flag (mainly used for testing). Use '1' to only log actions, or '0' to apply changes."
    required: false
    default: "0"
  repository:
    description: "The GitHub repository in 'owner/repo' format. Defaults to the current repository."
    required: false
    default: "${{ github.repository }}"
  source_environment:
    description: "The name of the source GitHub repository environment to copy variables from."
    required: true
  destination_environment:
    description: "The name of the destination GitHub repository environment to copy variables to."
    required: true
  variables:
    description: "Optional list of source variable names to copy. Accepted formats: JSON array (string) (e.g. '[\"VAR_A\",\"VAR_B\"]') or comma-separated, no space, string (e.g. VAR_A,VAR_B). Use '[]' or empty to copy all source variables."
    required: false
    default: '[]'

runs:
  using: "composite"
  steps:
  - name: Copy existing GitHub repository environment variables
    shell: bash
    env:
      GH_TOKEN: ${{ env.GHTOKEN }}
    run: |
      set -euo pipefail

      # Read action inputs.
      DRY_RUN_RAW="${{ inputs.dry_run }}"
      SRC_ENV="${{ inputs.source_environment }}"
      DEST_ENV="${{ inputs.destination_environment }}"
      VARS_TO_COPY='${{ inputs.variables }}'

      if [[ "$DRY_RUN_RAW" != "0" && "$DRY_RUN_RAW" != "1" ]]; then
        echo "❌ Invalid 'dry_run' value: '$DRY_RUN_RAW'. Use '0' or '1'."
        exit 1
      fi

      if [[ "$DRY_RUN_RAW" == "1" ]]; then
        echo "ℹ️ 'dry_run' enabled. No variables will be created or modified."
      fi

      # Fetch all variables from the source environment.
      response="$(gh api "repos/${{ inputs.repository }}/environments/$SRC_ENV/variables")"
      # Fail fast if GitHub API response is not valid JSON.
      if ! jq -e . >/dev/null 2>&1 <<< "$response"; then
        echo "❌ Failed to parse source variables response as JSON."
        echo "$response"
        exit 1
      fi

      # Build an in-memory map: SOURCE_VARS[name]=value.
      declare -A SOURCE_VARS=()
      while IFS=$'\t' read -r name value; do
        SOURCE_VARS["$name"]="$value"
      done < <(jq -r '(.variables // [])[] | [.name, .value] | @tsv' <<< "$response")

      # Fetch and parse destination environment variables.
      dest_list_response="$(gh api "repos/${{ inputs.repository }}/environments/$DEST_ENV/variables")"
      if ! jq -e . >/dev/null 2>&1 <<< "$dest_list_response"; then
        echo "❌ Failed to parse destination variables response as JSON."
        echo "$dest_list_response"
        exit 1
      fi

      declare -A DEST_VARS=()
      while IFS=$'\t' read -r name value; do
        DEST_VARS["$name"]="$value"
      done < <(jq -r '(.variables // [])[] | [.name, .value] | @tsv' <<< "$dest_list_response")

      # Resolve which variable names should be copied.
      # Supported formats: empty/[] (all), JSON array, or comma-separated list.
      declare -a NAMES_TO_COPY=()
      COPY_ALL="0"
      if [[ -z "$VARS_TO_COPY" || "$VARS_TO_COPY" == "[]" ]]; then
        COPY_ALL="1"
        for name in "${!SOURCE_VARS[@]}"; do
          NAMES_TO_COPY+=("$name")
        done
      elif jq -e . >/dev/null 2>&1 <<< "$VARS_TO_COPY" && jq -e 'type == "array"' >/dev/null 2>&1 <<< "$VARS_TO_COPY"; then
        while read -r name; do
          [[ -z "$name" ]] && continue
          NAMES_TO_COPY+=("$name")
        done < <(jq -r '.[]' <<< "$VARS_TO_COPY")
      else
        while IFS= read -r name; do
          name="${name## }"
          name="${name%% }"
          [[ -z "$name" ]] && continue
          NAMES_TO_COPY+=("$name")
        done < <(tr ',' '\n' <<< "$VARS_TO_COPY")
      fi

      # Delete destination variables that should no longer exist.
      # - Full sync mode (variables empty/[]): delete any destination-only variable.
      # - Subset mode: delete only selected names that are missing in source.
      if [[ "$COPY_ALL" == "1" ]]; then
        for name in "${!DEST_VARS[@]}"; do
          if [[ -z "${SOURCE_VARS[$name]+x}" ]]; then
            if [[ "$DRY_RUN_RAW" == "1" ]]; then
              echo "[DRY_RUN] Would delete '$name' from '$DEST_ENV' (missing in source '$SRC_ENV')."
            else
              echo "ℹ️ Deleting '$name' from '$DEST_ENV' (missing in source '$SRC_ENV')."
              gh api --silent --method DELETE -H 'Accept: application/vnd.github+json' "repos/${{ inputs.repository }}/environments/$DEST_ENV/variables/$name"
              echo "✅ Deleted '$name' from '$DEST_ENV'."
            fi
          fi
        done
      else
        for name in "${NAMES_TO_COPY[@]}"; do
          if [[ -n "${DEST_VARS[$name]+x}" && -z "${SOURCE_VARS[$name]+x}" ]]; then
            if [[ "$DRY_RUN_RAW" == "1" ]]; then
              echo "[DRY_RUN] Would delete '$name' from '$DEST_ENV' (selected but missing in source '$SRC_ENV')."
            else
              echo "ℹ️ Deleting '$name' from '$DEST_ENV' (selected but missing in source '$SRC_ENV')."
              gh api --silent --method DELETE -H 'Accept: application/vnd.github+json' "repos/${{ inputs.repository }}/environments/$DEST_ENV/variables/$name"
              echo "✅ Deleted '$name' from '$DEST_ENV'."
            fi
          fi
        done
      fi

      export_to_github_env() {
        local var_name="$1"
        local var_value="$2"
        local delimiter
        delimiter="__GITHUB_ENV_DELIM_${RANDOM}_$(date +%s)__"
        {
          echo "$var_name<<$delimiter"
          echo "$var_value"
          echo "$delimiter"
        } >> "$GITHUB_ENV"
      }

      # Copy each selected variable from source to destination.
      # If destination exists and value differs, update it.
      for name in "${NAMES_TO_COPY[@]}"; do
        if [[ -z "${SOURCE_VARS[$name]+x}" ]]; then
          echo "⚠️ '$name' does not exist in source environment '$SRC_ENV'. Skipping."
          continue
        fi

        value="${SOURCE_VARS[$name]}"
        if dest_response="$(gh api "repos/${{ inputs.repository }}/environments/$DEST_ENV/variables/$name" 2>/dev/null)"; then
          dest_value="$(jq -r '.value // empty' <<< "$dest_response")"

          if [[ "$dest_value" == "$value" ]]; then
            echo "⚠️ '$name' already exists in '$DEST_ENV' with the same value. Skipping update."
          elif [[ "$DRY_RUN_RAW" == "1" ]]; then
            echo "[DRY_RUN] Would update '$name' in '$DEST_ENV' (value differs from source '$SRC_ENV')."
          else
            echo "ℹ️ Updating '$name' in '$DEST_ENV' (value differs from source '$SRC_ENV')."
            gh api --silent --method PATCH -H 'Accept: application/vnd.github+json' "repos/${{ inputs.repository }}/environments/$DEST_ENV/variables/$name" -f name="$name" -f value="$value"
            export_to_github_env "$name" "$value"
            echo "✅ Updated '$name' and exported to GITHUB_ENV."
          fi
        else
          if [[ "$DRY_RUN_RAW" == "1" ]]; then
            echo "[DRY_RUN] Would copy '$name' from '$SRC_ENV' to '$DEST_ENV'."
          else
            echo "ℹ️ Copying '$name' from '$SRC_ENV' to '$DEST_ENV'."
            gh api --silent --method POST -H 'Accept: application/vnd.github+json' "repos/${{ inputs.repository }}/environments/$DEST_ENV/variables" -f name="$name" -f value="$value"
            export_to_github_env "$name" "$value"
            echo "✅ Created '$name' and exported to GITHUB_ENV."
          fi
        fi
      done

      echo "✅ Repository environment variables copy process completed."
