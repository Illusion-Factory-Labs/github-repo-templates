name: Sincronizar variáveis de ambiente do repositório GitHub
description: >-
  Sincroniza variáveis para o mesmo repositório de um ambiente de origem para um ambiente de destino, criando ou atualizando 
  valores de destino quando necessário. Por padrão, todas as variáveis do ambiente de origem serão sincronizadas para o destino 
  (incluindo a exclusão de variáveis exclusivas do destino), mas também é possível especificar um subconjunto de nomes de 
  variáveis para sincronizar, se desejar.

inputs:
  DRY_RUN:
    description: >-
      Flag de modo dry-run (principalmente usado para testes). Use 'true' para somente registrar as ações que seriam tomadas sem 
      realmente criar, atualizar ou excluir variáveis, ou 'false' para aplicar alterações.
    required: false
    default: "false"
  REPOSITORY:
    description: "O repositório GitHub no formato 'owner/repo'. Padrão é o repositório atual."
    required: false
    default: "${{ github.repository }}"
  SRC_ENV:
    description: "O nome do ambiente de origem do repositório GitHub para sincronizar variáveis."
    required: false
    default: "${{ matrix.AMBIENTE }}"
  DEST_ENV:
    description: "O nome do ambiente de destino do repositório GitHub para sincronizar variáveis."
    required: false
    default: "${{ matrix.AMBIENTE == 'prd' && 'prd-vars' || matrix.AMBIENTE == 'tqs' && 'tqs-vars' }}"
  VARS_TO_SYNC:
    description: >-
      Opcionalmente, uma lista de nomes de variáveis de origem para sincronizar. Formatos aceitos: array JSON 
      (ex. ["VAR_A", "VAR_B"]) ou string separada por vírgulas, sem espaços (ex. VAR_A,VAR_B). O padrão é um array JSON vazio, o 
      que significa sincronizar todas as variáveis de origem.
    required: false
    default: '[]'
  DEL_ENV:
    description: >-
      Flag para indicar se o ambiente de destino criado deve ser excluído. Use 'true' para excluir, ou 'false' para 
      manter o ambiente. Por padrão, depois da exportacão das variáveis para o GITHUB_ENV, o ambiente de destino será 
      excluido.
    required: false
    default: 'true'

outputs:
  changed_variables_json:
    description: "Array JSON com os nomes das variáveis criadas ou atualizadas no ambiente de destino."
    value: ${{ steps.sync-vars.outputs.changed_variables_json }}

runs:
  using: "composite"
  steps:
  - name: Sincronizar variáveis do ambiente (${{ inputs.SRC_ENV }}) para o ambiente (${{ inputs.DEST_ENV }})
    id: sync-vars
    shell: bash
    env:
      GH_TOKEN: ${{ env.GHTOKEN }}
    run: |
      set -euo pipefail

      # Read action inputs.
      DRY_RUN_RAW="${{ inputs.DRY_RUN }}"
      SRC_ENV="${{ inputs.SRC_ENV }}"
      DEST_ENV="${{ inputs.DEST_ENV }}"
      VARS_TO_SYNC='${{ inputs.VARS_TO_SYNC }}'
      SRC_VARS_API_ENDPOINT="repos/${{ inputs.REPOSITORY }}/environments/$SRC_ENV/variables"
      DEST_VARS_API_ENDPOINT="repos/${{ inputs.REPOSITORY }}/environments/$DEST_ENV/variables"

      if [[ "$DRY_RUN_RAW" != "true" && "$DRY_RUN_RAW" != "false" ]]; then
        echo "❌ Valor 'dry_run' inválido: '$DRY_RUN_RAW'. Use 'true' ou 'false'."
        exit 1
      fi

      if [[ "$DRY_RUN_RAW" == "true" ]]; then
        echo -e "ℹ️ 'dry_run' habilitado. Nenhuma variável será criada ou modificada.\n"
      fi

      # Fetch all variables from the source environment.
      response="$(gh api "$SRC_VARS_API_ENDPOINT")"
      # Fail fast if GitHub API response is not valid JSON.
      if ! jq -e . >/dev/null 2>&1 <<< "$response"; then
        echo "❌ Falha ao analisar a resposta das variáveis de origem como JSON."
        echo "$response"
        exit 1
      fi

      # Build an in-memory map: SOURCE_VARS[name]=value.
      declare -A SOURCE_VARS=()
      while IFS=$'\t' read -r name value; do
        SOURCE_VARS["$name"]="$value"
      done < <(jq -r '(.variables // [])[] | [.name, .value] | @tsv' <<< "$response")

      # Fetch and parse destination environment variables.
      dest_list_response="$(gh api "$DEST_VARS_API_ENDPOINT")"
      if ! jq -e . >/dev/null 2>&1 <<< "$dest_list_response"; then
        echo "❌ Falha ao analisar a resposta das variáveis de destino como JSON."
        echo "$dest_list_response"
        exit 1
      fi

      declare -A DEST_VARS=()
      while IFS=$'\t' read -r name value; do
        DEST_VARS["$name"]="$value"
      done < <(jq -r '(.variables // [])[] | [.name, .value] | @tsv' <<< "$dest_list_response")

      # Resolve which variable names should be synced.
      # Supported formats: empty/[] (all), JSON array, or comma-separated list.
      declare -a NAMES_TO_COPY=()
      declare -a CREATED_VARS=()
      declare -a UPDATED_VARS=()
      COPY_ALL="0"
      if [[ -z "$VARS_TO_SYNC" || "$VARS_TO_SYNC" == "[]" ]]; then
        COPY_ALL="1"
        for name in "${!SOURCE_VARS[@]}"; do
          NAMES_TO_COPY+=("$name")
        done
      elif jq -e . >/dev/null 2>&1 <<< "$VARS_TO_SYNC" && jq -e 'type == "array"' >/dev/null 2>&1 <<< "$VARS_TO_SYNC"; then
        while read -r name; do
          [[ -z "$name" ]] && continue
          NAMES_TO_COPY+=("$name")
        done < <(jq -r '.[]' <<< "$VARS_TO_SYNC")
      else
        while IFS= read -r name; do
          name="${name## }"
          name="${name%% }"
          [[ -z "$name" ]] && continue
          NAMES_TO_COPY+=("$name")
        done < <(tr ',' '\n' <<< "$VARS_TO_SYNC")
      fi

      # Delete destination variables that should no longer exist.
      # - Full sync mode (variables empty/[]): delete any destination-only variable.
      # - Subset mode: delete only selected names that are missing in source.
      if [[ "$COPY_ALL" == "1" ]]; then
        for name in "${!DEST_VARS[@]}"; do
          if [[ -z "${SOURCE_VARS[$name]+x}" ]]; then
            if [[ "$DRY_RUN_RAW" == "true" ]]; then
              echo "[DRY_RUN] A variável '$name' seria deletada de '$DEST_ENV' (ausente na origem '$SRC_ENV')."
            else
              echo "ℹ️ Deletando a variável '$name' de '$DEST_ENV' (ausente na origem '$SRC_ENV')."
              gh api --silent --method DELETE -H 'Accept: application/vnd.github+json' "$DEST_VARS_API_ENDPOINT/$name"
              echo "✅ Deletado '$name' de '$DEST_ENV'."
            fi
          fi
        done
      else
        for name in "${NAMES_TO_COPY[@]}"; do
          if [[ -n "${DEST_VARS[$name]+x}" && -z "${SOURCE_VARS[$name]+x}" ]]; then
            if [[ "$DRY_RUN_RAW" == "true" ]]; then
              echo "[DRY_RUN] A variável '$name' seria deletada de '$DEST_ENV' (selecionada mas ausente na origem '$SRC_ENV')."
            else
              echo "ℹ️ Deletando a variável '$name' de '$DEST_ENV' (selecionada mas ausente na origem '$SRC_ENV')."
              gh api --silent --method DELETE -H 'Accept: application/vnd.github+json' "$DEST_VARS_API_ENDPOINT/$name"
              echo "✅ Deletado '$name' de '$DEST_ENV'."
            fi
          fi
        done
      fi

      export_to_github_env() {
        local var_name="$1"
        local var_value="$2"
        local delimiter
        delimiter="__GITHUB_ENV_DELIM_${RANDOM}_$(date +%s)__"
        {
          echo "$var_name<<$delimiter"
          echo "$var_value"
          echo "$delimiter"
        } >> "$GITHUB_ENV"
      }

      # Sync each selected variable from source to destination.
      # If destination exists and value differs, update it.
      for name in "${NAMES_TO_COPY[@]}"; do
        if [[ -z "${SOURCE_VARS[$name]+x}" ]]; then
          echo "⚠️ '$name' não existe no ambiente de origem '$SRC_ENV'. Pulando."
          continue
        fi

        value="${SOURCE_VARS[$name]}"
        if dest_response="$(gh api "$DEST_VARS_API_ENDPOINT/$name" 2>/dev/null)"; then
          dest_value="$(jq -r '.value // empty' <<< "$dest_response")"

          if [[ "$dest_value" == "$value" ]]; then
            echo "⚠️ A variável '$name' já existe em '$DEST_ENV' com o mesmo valor. Pulando atualização."
          elif [[ "$DRY_RUN_RAW" == "true" ]]; then
                echo "[DRY_RUN] A variável '$name' seria atualizada em '$DEST_ENV' (valor difere da origem '$SRC_ENV')."
          else
            echo "ℹ️ Atualizando a variável '$name' em '$DEST_ENV' (valor difere da origem '$SRC_ENV')."
            gh api --silent --method PATCH -H 'Accept: application/vnd.github+json' "$DEST_VARS_API_ENDPOINT/$name" -f name="$name" -f value="$value"
            UPDATED_VARS+=("$name")
            export_to_github_env "$name" "$value"
            echo "✅ Atualizado a variável '$name' e exportado para GITHUB_ENV."
          fi
        else
          if [[ "$DRY_RUN_RAW" == "true" ]]; then
            echo "[DRY_RUN] A variável '$name' seria copiada de '$SRC_ENV' para '$DEST_ENV'."
          else
            echo "ℹ️ Criando a variável '$name' de '$SRC_ENV' para '$DEST_ENV'."
            gh api --silent --method POST -H 'Accept: application/vnd.github+json' "$DEST_VARS_API_ENDPOINT" -f name="$name" -f value="$value"
            CREATED_VARS+=("$name")
            export_to_github_env "$name" "$value"
            echo "✅ Criado a variável '$name' e exportado para GITHUB_ENV."
          fi
        fi
      done

      if [[ ${#CREATED_VARS[@]} -gt 0 ]]; then
        created_variables_json="$(printf '%s\n' "${CREATED_VARS[@]}" | jq -R . | jq -cs .)"
      else
        created_variables_json='[]'
      fi

      if [[ ${#UPDATED_VARS[@]} -gt 0 ]]; then
        updated_variables_json="$(printf '%s\n' "${UPDATED_VARS[@]}" | jq -R . | jq -cs .)"
      else
        updated_variables_json='[]'
      fi

      changed_variables_json="$(jq -cn --argjson created "$created_variables_json" --argjson updated "$updated_variables_json" '$created + $updated')"

      if [[ ${changed_variables_json} == '[]' ]]; then
        echo "⚠️ Nenhuma variável foi criada ou atualizada em '$DEST_ENV'."
      else
        echo "✅ Variáveis criadas ou atualizadas em '$DEST_ENV': $changed_variables_json"
      fi
      
      echo "changed_variables_json=$changed_variables_json" >> "$GITHUB_OUTPUT"

      echo -e "\n✅ Processo de sincronização das variáveis de ambiente concluído.\n"

  - name: "Exportar as variáveis do ambiente de destino para GITHUB_ENV (para uso em passos posteriores do workflow)"
    shell: bash
    env:
      GH_TOKEN: ${{ env.GHTOKEN }}
    run: |
      set -euo pipefail

      DEST_ENV="${{ inputs.DEST_ENV }}"
      DEST_VARS_API_ENDPOINT="repos/${{ inputs.REPOSITORY }}/environments/$DEST_ENV/variables"

      # Buscar as variáveis de ambiente de destino novamente para garantir que o estado mais recente após a sincronização.
      dest_list_response="$(gh api "$DEST_VARS_API_ENDPOINT")"
      if ! jq -e . >/dev/null 2>&1 <<< "$dest_list_response"; then
        echo "❌ Falha ao analisar a resposta das variáveis de destino como JSON."
        echo "$dest_list_response"
        exit 1
      fi

      # Exportar cada variável de destino para GITHUB_ENV para uso em passos posteriores do workflow.
      while IFS=$'\t' read -r name value; do
        export_to_github_env() {
          local var_name="$1"
          local var_value="$2"
          local delimiter
          delimiter="__GITHUB_ENV_DELIM_${RANDOM}_$(date +%s)__"
          {
            echo "$var_name<<$delimiter"
            echo "$var_value"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
        }

        export_to_github_env "$name" "$value"
        echo "✅ Exportado a variável '$name' de '$DEST_ENV' para GITHUB_ENV."
      done < <(jq -r '(.variables // [])[] | [.name, .value] | @tsv' <<< "$dest_list_response")

      echo -e "\n✅  processo de exportação das variáveis de '$DEST_ENV' para GITHUB_ENV foi concluído.\n"

  - name: "Excluir ambiente de destino ${{ inputs.DEST_ENV }}"
    if: ${{ inputs.DEL_ENV == 'true' }}
    shell: bash
    env:
      GH_TOKEN: ${{ env.GHTOKEN }}
    run: |
      set -euo pipefail

      DRY_RUN_RAW="${{ inputs.DRY_RUN }}"
      DEST_ENV="${{ inputs.DEST_ENV }}"
      DEST_ENV_API_ENDPOINT="repos/${{ inputs.REPOSITORY }}/environments/$DEST_ENV"

      if [[ "$DRY_RUN_RAW" == "true" ]]; then
        echo "[DRY_RUN] O ambiente '$DEST_ENV' seria excluído."
      else
        echo "ℹ️ Excluindo ambiente '$DEST_ENV'..."
        gh api --silent --method DELETE -H 'Accept: application/vnd.github+json' "$DEST_ENV_API_ENDPOINT"
        echo "✅ Ambiente '$DEST_ENV' excluído com sucesso."
      fi