name: Sync GitHub repository environment variables
description: >-
  Sync variables for the same repository from a source environment to a destination environment, creating or updating destination values when needed. 
  This action is useful for keeping environment variables DRY across multiple environments (e.g. dev, staging, prod) or for syncing variables 
  to a new environment without needing to re-enter them manually. By default, all variables from the source environment will be synced to destination 
  (including deletion of destination-only variables), but you can also specify a subset of variable names to sync if desired.

inputs:
  DRY_RUN:
    description: "Dry-run mode flag (mainly used for testing). Use 'true' to only log actions, or 'false' to apply changes."
    required: false
    default: "false"
  VARIABLES_TO_SYNC:
    description: >-
      'Optional comma of source variable names to sync. Accepted formats: JSON array (e.g. ["VAR_A", "VAR_B"]) or 
      comma-separated, no space, string (e.g. VAR_A,VAR_B). Defaults to empty JSON array, which means sync all source variables.'
    required: false
    default: '[]'

runs:
  using: "composite"
  steps:
  - name: Sync existing GitHub repository environment variables
    shell: bash
    env:
      GH_TOKEN: ${{ env.GHTOKEN }}
    run: |
      set -euo pipefail

      DRY_RUN_RAW="${{ inputs.DRY_RUN }}"
      REPOSITORY="${{ github.repository }}"
      SRC_ENV="${{ matrix.AMBIENTE }}"
      DEST_ENV="${{ matrix.AMBIENTE == 'prd' && 'prd-vars' || (matrix.AMBIENTE == 'tqs' &&  'tqs-vars' || matrix.AMBIENTE) }}"
      VARIABLES_TO_SYNC='${{ inputs.VARIABLES_TO_SYNC }}'
      SRC_API_ENDPOINT="repos/$REPOSITORY/environments/$SRC_ENV/variables"
      DEST_API_ENDPOINT="repos/$REPOSITORY/environments/$DEST_ENV/variables"

      if [[ "$DRY_RUN_RAW" != "true" && "$DRY_RUN_RAW" != "false" ]]; then
        echo "❌ Invalid 'DRY_RUN' value: '$DRY_RUN_RAW'. Use 'true' or 'false'."
        exit 1
      fi

      if [[ "$DRY_RUN_RAW" == "true" ]]; then
        echo -e "ℹ️ 'DRY_RUN' enabled. No variables will be created or modified.\n"
      fi

      # Fetch all variables from the source environment.
      response="$(gh api "$SRC_API_ENDPOINT")"
      # Fail fast if GitHub API response is not valid JSON.
      if ! jq -e . >/dev/null 2>&1 <<< "$response"; then
        echo "❌ Failed to parse source variables response as JSON."
        echo "$response"
        exit 1
      fi

      # Build an in-memory map: SOURCE_VARS[name]=value.
      declare -A SOURCE_VARS=()
      while IFS=$'\t' read -r name value; do
        SOURCE_VARS["$name"]="$value"
      done < <(jq -r '(.variables // [])[] | [.name, .value] | @tsv' <<< "$response")

      # Fetch and parse destination environment variables.
      dest_list_response="$(gh api "$DEST_API_ENDPOINT")"
      if ! jq -e . >/dev/null 2>&1 <<< "$dest_list_response"; then
        echo "❌ Failed to parse destination variables response as JSON."
        echo "$dest_list_response"
        exit 1
      fi

      declare -A DEST_VARS=()
      while IFS=$'\t' read -r name value; do
        DEST_VARS["$name"]="$value"
      done < <(jq -r '(.variables // [])[] | [.name, .value] | @tsv' <<< "$dest_list_response")

      # Resolve which variable names should be synced.
      # Supported formats: empty/[] (all), JSON array, or comma-separated list.
      declare -a NAMES_TO_COPY=()
      COPY_ALL="0"
      if [[ -z "$VARIABLES_TO_SYNC" || "$VARIABLES_TO_SYNC" == "[]" ]]; then
        COPY_ALL="1"
        for name in "${!SOURCE_VARS[@]}"; do
          NAMES_TO_COPY+=("$name")
        done
      elif jq -e . >/dev/null 2>&1 <<< "$VARIABLES_TO_SYNC" && jq -e 'type == "array"' >/dev/null 2>&1 <<< "$VARIABLES_TO_SYNC"; then
        while read -r name; do
          [[ -z "$name" ]] && continue
          NAMES_TO_COPY+=("$name")
        done < <(jq -r '.[]' <<< "$VARIABLES_TO_SYNC")
      else
        while IFS= read -r name; do
          name="${name## }"
          name="${name%% }"
          [[ -z "$name" ]] && continue
          NAMES_TO_COPY+=("$name")
        done < <(tr ',' '\n' <<< "$VARIABLES_TO_SYNC")
      fi

      # Delete destination variables that should no longer exist.
      # - Full sync mode (variables empty/[]): delete any destination-only variable.
      # - Subset mode: delete only selected names that are missing in source.
      if [[ "$COPY_ALL" == "1" ]]; then
        for name in "${!DEST_VARS[@]}"; do
          if [[ -z "${SOURCE_VARS[$name]+x}" ]]; then
            if [[ "$DRY_RUN_RAW" == "true" ]]; then
              echo -e "ℹ️[DRY_RUN] Would delete '$name' from '$DEST_ENV' (missing in source '$SRC_ENV').\n"
            else
              echo "ℹ️ Deleting '$name' from '$DEST_ENV' (missing in source '$SRC_ENV')."
              gh api --silent --method DELETE -H 'Accept: application/vnd.github+json' "$DEST_API_ENDPOINT/$name"
              echo -e "✅ Deleted '$name' from '$DEST_ENV'.\n"
            fi
          fi
        done
      else
        for name in "${NAMES_TO_COPY[@]}"; do
          if [[ -n "${DEST_VARS[$name]+x}" && -z "${SOURCE_VARS[$name]+x}" ]]; then
            if [[ "$DRY_RUN_RAW" == "true" ]]; then
              echo "ℹ️[DRY_RUN] Would delete '$name' from '$DEST_ENV' (selected but missing in source '$SRC_ENV')."
            else
              echo "ℹ️ Deleting '$name' from '$DEST_ENV' (selected but missing in source '$SRC_ENV')."
              gh api --silent --method DELETE -H 'Accept: application/vnd.github+json' "$DEST_API_ENDPOINT/$name"
              echo -e "✅ Deleted '$name' from '$DEST_ENV'.\n"
            fi
          fi
        done
      fi

      export_to_github_env() {
        local var_name="$1"
        local var_value="$2"
        local delimiter
        delimiter="__GITHUB_ENV_DELIM_${RANDOM}_$(date +%s)__"
        {
          echo "$var_name<<$delimiter"
          echo "$var_value"
          echo "$delimiter"
        } >> "$GITHUB_ENV"
      }

      # Sync each selected variable from source to destination.
      # If destination exists and value differs, update it.
      for name in "${NAMES_TO_COPY[@]}"; do
        if [[ -z "${SOURCE_VARS[$name]+x}" ]]; then
          echo "⚠️ '$name' does not exist in source environment '$SRC_ENV'. Skipping."
          continue
        fi

        value="${SOURCE_VARS[$name]}"
        if dest_response="$(gh api "$DEST_API_ENDPOINT/$name" 2>/dev/null)"; then
          dest_value="$(jq -r '.value // empty' <<< "$dest_response")"

          if [[ "$dest_value" == "$value" ]]; then
            echo "⚠️ '$name' already exists in '$DEST_ENV' with the same value. Skipping update."
          elif [[ "$DRY_RUN_RAW" == "true" ]]; then
            echo "ℹ️[DRY_RUN] Would update '$name' in '$DEST_ENV' (value differs from source '$SRC_ENV')."
          else
            echo "ℹ️ Updating '$name' in '$DEST_ENV' (value differs from source '$SRC_ENV')."
            gh api --silent --method PATCH -H 'Accept: application/vnd.github+json' "$DEST_API_ENDPOINT/$name" -f name="$name" -f value="$value"
            export_to_github_env "$name" "$value"
            echo -e "✅ Updated '$name' and exported to GITHUB_ENV.\n"
          fi
        else
          if [[ "$DRY_RUN_RAW" == "true" ]]; then
            echo "ℹ️[DRY_RUN] Would copy '$name' from '$SRC_ENV' to '$DEST_ENV'."
          else
            echo "ℹ️ Creating '$name' from '$SRC_ENV' to '$DEST_ENV'."
            gh api --silent --method POST -H 'Accept: application/vnd.github+json' "$DEST_API_ENDPOINT" -f name="$name" -f value="$value"
            export_to_github_env "$name" "$value"
            echo -e "✅ Created '$name' and exported to GITHUB_ENV.\n"
          fi
        fi
      done

      echo -e "\n✅ Repository environment variables sync process completed.\n"
